name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Guards the seams a build can't: manifest/search index drift, missing
      # icons, untranslated lessons, labels nothing renders.
      - name: Test
        run: npm test

      # `prebuild` regenerates the manifest and search index, so a build that
      # passes here proves the generated data is in sync with the modules.
      - name: Build
        run: npm run build
