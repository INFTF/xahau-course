name: Deploy to GitHub Pages

# Manual only, on purpose: this repo publishes to the SITE_URL in
# site.config.js (learn.xahau.network/xahau-course by default), and whoever
# owns that host should confirm Pages is the right target before this starts
# running on its own. To build for another host, set a repository variable
# SITE_URL (Settings -> Secrets and variables -> Actions -> Variables). To deploy automatically on every push to main,
# uncomment the `push` trigger below and enable Pages (Settings -> Pages ->
# Source: GitHub Actions).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Empty unless the repository variable is set: site.config.js then
          # falls back to its default
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
