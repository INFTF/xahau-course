<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xahau Learn — A basic course on Xahau</title>
    <meta
      name="description"
      content="A free, open-source basic course on Xahau, in eight languages: accounts, transactions, tokens, NFTs and Hooks — from zero to your first smart contract."
    />
    <meta name="theme-color" content="#f7f7f7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xahau Learn — A basic course on Xahau" />
    <meta
      property="og:description"
      content="A free, open-source basic course on Xahau, in eight languages."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:site_name" content="Xahau Learn" />
    <!-- Social cards need a raster image at an absolute URL: SVG and relative
         paths are silently dropped by Twitter, LinkedIn, Slack and WhatsApp.
         Regenerate with scripts/make-og-image.py -->
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Xahau Learn — a basic course on Xahau" />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Theme bootstrap: React applies data-theme in an effect, which is one
         paint too late — dark-mode readers saw a white flash on every load.
         Runs before the app script so the first paint is already correct. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('xahau-theme')
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
